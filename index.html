<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ícones com URL fixa (public/icons), em múltiplos de 48px, como o Google pede -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <!-- nome do site para navegadores, favoritos e tela inicial -->
    <meta name="application-name" content="Sávio Godinho">
    <meta name="apple-mobile-web-app-title" content="Sávio Godinho">
    <meta name="author" content="Sávio Godinho">
    <!-- title, description, canonical, hreflang, Open Graph e JSON-LD vêm de src/seo/head.js (useHead) -->
    <meta name="google-site-verification" content="Xy4-oBUOLRQqBfVErumOHNVFdYwEZKFiYoLo72LW96Q">
    <meta name="theme-color" content="#0a0f0a">

    <!-- Aplica o tema antes do primeiro paint (evita piscar o tema errado).
         Padrão: escuro. O claro só vale se o visitante escolheu no botão. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.dataset.theme = t;
        // libera as animações de entrada só se o visitante não pediu "reduzir movimento"
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('motion-ok');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
