<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — command not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=VT323&display=swap">
    <style>
      :root {
        --bg: #0a0f0a;
        --fg: #33ff66;
        --muted: #27b35a;
        --accent: #ffb000;
        --border: #1f7a3a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 'IBM Plex Mono', ui-monospace, monospace;
        text-shadow: 0 0 6px rgba(51, 255, 102, 0.45);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem 1.5rem;
        border: 3px double var(--border);
      }

      h1 {
        font: 400 clamp(3rem, 12vw, 5rem)/1 'VT323', monospace;
        color: var(--accent);
        text-shadow: 0 0 6px rgba(255, 176, 0, 0.45);
      }

      p {
        margin-top: 1rem;
        overflow-wrap: anywhere;
      }

      .muted {
        color: var(--muted);
      }

      a {
        color: var(--accent);
        text-decoration: underline dashed;
        text-underline-offset: 0.2em;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        margin-top: 1.5rem;
      }

      .cursor::after {
        content: '▋';
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p><span class="muted">savio@godinho:~ $</span> cd <span id="path">esta-pagina</span></p>
      <p>bash: cd: <span id="path2">esta-pagina</span>: No such file or directory<span class="cursor"></span></p>
      <p class="muted">Página não encontrada · Page not found</p>
      <div class="links">
        <a href="/">cd ~ (português)</a>
        <a href="/en/" hreflang="en" lang="en">cd ~/en (english)</a>
      </div>
    </main>
    <script>
      // mostra o caminho que a pessoa tentou abrir (só texto, sem HTML)
      var p = decodeURIComponent(location.pathname) || '/';
      document.getElementById('path').textContent = p;
      document.getElementById('path2').textContent = p;
    </script>
  </body>
</html>
